scheduler=spread
workload=poisson

num_tenants=3
functions_per_tenant=2
num_workers=4
total_invocations=120
batch_size=10
time_step=5
seed=123

arrival_rate=0.5
idle_timeout=60

attacker.enabled=1
attacker.tenant=999
attacker.function=100
attacker.attack_per_victim=1.0

# Base worker capacity
worker.cpu_cores=4.0
worker.memory_mb=4096
worker.storage_mb=200

# Make half the workers "small" (2 cores, 2 GB)
hetero.enabled=1
hetero.small_frac=0.5
hetero.small_cpu_scale=0.5
hetero.small_mem_scale=0.5

prewarm.enabled=0

output_csv=results/hetero_spread_poisson.csv

trace.enabled=1
trace.file=results/hetero_spread_trace.log